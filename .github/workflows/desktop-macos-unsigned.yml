name: Desktop macOS (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-unsigned:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run desktop:build

      - name: Package unsigned mac artifacts
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-build
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.blockmap
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*-mac.zip
            release/*.blockmap
